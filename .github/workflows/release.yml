name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------- Linux
  linux:
    name: Linux binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libxcb1-dev \
            libxrandr-dev libxi-dev libxcursor-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Determine version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: cargo build --release

      - name: Package tarball
        run: |
          VER="${{ steps.ver.outputs.version }}"
          ASSET="STO-CLARE-$VER-linux-x86_64.tar.gz"
          # Files at the archive root (no wrapping dir) so `self_update` can
          # find the binary directly during `--upgrade`.
          STAGE="$(mktemp -d)"
          cp target/release/sto-clare "$STAGE/"
          cp icon/icon.png "$STAGE/"
          cp install.sh "$STAGE/" 2>/dev/null || true
          tar -czf "$ASSET" -C "$STAGE" .
          echo "asset=$ASSET" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: linux-tarball
          path: ${{ env.asset }}

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.asset }}

  # ---------------------------------------------------------------- Windows
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: cargo build --release

      - name: Build installer (Inno Setup)
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=${{ steps.ver.outputs.version }}" `
            "packaging\windows\STO-CLARE.iss"

      - name: Package portable zip
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          # Bare exe in a zip so `self_update` can replace the binary on --upgrade.
          Compress-Archive -Path target\release\sto-clare.exe `
            -DestinationPath "STO-CLARE-$ver-windows-x86_64.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist/installer/*.exe
            STO-CLARE-*-windows-x86_64.zip

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/installer/*.exe
            STO-CLARE-*-windows-x86_64.zip
