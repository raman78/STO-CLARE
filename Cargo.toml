[workspace]

[package]
name = "STO_CombatLogAnalyzer"
version = "1.6.1"
edition = "2024"
license = "MIT OR Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
eframe = { version = "0.34", features = ["wgpu"] }
egui_plot = { version = "0.35" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
lazy_static = "1"
regex = "1"
bitflags = "2"
log = { version = "0.4", features = ["serde"] }
rustc-hash = "2"
rfd = { version = "0.17" }
dirs = "6"
self_update = { version = "0.42", default-features = false, features = [
    "rustls",
    "archive-tar",
    "compression-flate2",
    "archive-zip",
] }
serde_json = "1"
serde = { version = "1", features = ["serde_derive"] }
smallvec = { version = "1", features = ["const_new", "const_generics"] }
crossbeam-channel = "0.5"
simplelog = "0.12"
notify = "8"
timer = "0.2"
itertools = "0.14"
educe = { version = "0.6", default-features = false, features = [
    "Deref",
    "DerefMut",
] }
png = "0.18"
reqwest = { version = "0.13", features = [
    "blocking",
    "multipart",
    "json",
    "query",
] }
flate2 = "1"

[profile.release]
lto = "thin"

[target.'cfg(target_os = "linux")'.dependencies]
# Wayland layer-shell overlay: always-on-top over full-screen games, which the
# winit/eframe path cannot do on Wayland. Versions matched to eframe 0.34.
smithay-client-toolkit = "0.19"
egui = "0.34"
egui-wgpu = "0.34"
raw-window-handle = "0.6"
pollster = "0.4"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[target.'cfg(windows)'.dependencies]
mslnk = "0.1"
